name: Deploy to GitHub Pages

on:
  # Deploy every time main changes
  push:
    branches: [main]
  # Allow running it by hand from the Actions tab
  workflow_dispatch:

# Allow the job to read the repo and publish a Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Run one deployment at a time; let a running one finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install, build and upload the site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
